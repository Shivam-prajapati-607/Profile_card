<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Mentor | Profile card component</title>
    <meta name="description" content="A Profile card component challenge on Frontend Mentor.">
    <meta property="og:title" content="Frontend Mentor | Profile card component">
    <meta property="og:description" content="A product preview card component challenge on Frontend Mentor.">
    <meta property="og:image" content="">
    <meta property="og:type" content="website">

    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Kumbh+Sans:wght,YOPQ@100..900,300&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">

<body>
    <article class="container">
        <section class="pattern top">
            <img src="./images/bg-pattern-top.svg">
        </section>
        <div class="profile">
            <section class="bg-card">
                <img src="./images/bg-pattern-card.svg">
            </section>
            <div class="about">
                <img src="./images/image-victor.jpg">
                <span><a class="name">Victor Crest </a>26 </span>
                <span class="stat-label">London</span>
            </div>
            <hr class="line">
            <section class="main-stat">
                <div class="stat">
                    <span class="stat-number">80K</span>
                    <span class="stat-label">Followers</span>
                </div>

                <div class="stat">
                    <span class="stat-number">803K</span>
                    <span class="stat-label">Likes</span>
                </div>

                <div class="stat">
                    <span class="stat-number">1.4K</span>
                    <span class="stat-label">Photos</span>
                </div>
        </div>
        </section>
        <section class="pattern bottom">
            <img src="./images/bg-pattern-bottom.svg">
        </section>
    </article>
   <footer class="attribution">

  </footer>
</body>

</html>
